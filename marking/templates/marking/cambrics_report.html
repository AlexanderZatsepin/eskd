<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Таблица кембриков</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      color: #1f2933;
    }

    .page {
      max-width: 760px;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 18px 0 6px;
    }

    select {
      box-sizing: border-box;
      width: 100%;
      max-width: 460px;
      padding: 10px 12px;
      border: 1px solid #b8c2cc;
      border-radius: 4px;
      font-size: 15px;
      background: #fff;
    }

    .cabinet-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 4px;
      background: #1f4e79;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #173b5c;
    }

    .empty {
      margin-top: 18px;
      color: #64748b;
    }

    .error {
      max-width: 620px;
      margin: 18px 0;
      padding: 12px 14px;
      border: 1px solid #e2a3a3;
      border-radius: 4px;
      background: #fff5f5;
      color: #9b1c1c;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Таблица кембриков</h1>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <label for="project_id">Проект</label>
    <select id="project_id">
      <option value="">Выберите проект</option>
      {% for project in projects %}
        <option value="{{ project.id }}">{{ project.code }}{% if project.name %} - {{ project.name }}{% endif %}</option>
      {% endfor %}
    </select>

    <div id="cabinet_list" class="cabinet-list"></div>
    <div id="empty_message" class="empty">Выберите проект, чтобы увидеть список шкафов.</div>
  </main>

  <script>
    const cabinetsByProject = {{ cabinets_json|safe }};
    const projectSelect = document.getElementById("project_id");
    const cabinetList = document.getElementById("cabinet_list");
    const emptyMessage = document.getElementById("empty_message");
    const csrfToken = "{{ csrf_token }}";

    function clearCabinets() {
      while (cabinetList.firstChild) {
        cabinetList.removeChild(cabinetList.firstChild);
      }
    }

    function createDownloadButton(cabinet) {
      const form = document.createElement("form");
      form.method = "post";

      const csrf = document.createElement("input");
      csrf.type = "hidden";
      csrf.name = "csrfmiddlewaretoken";
      csrf.value = csrfToken;
      form.appendChild(csrf);

      const cabinetInput = document.createElement("input");
      cabinetInput.type = "hidden";
      cabinetInput.name = "cabinet_id";
      cabinetInput.value = cabinet.id;
      form.appendChild(cabinetInput);

      const button = document.createElement("button");
      button.type = "submit";
      button.textContent = cabinet.name ? `${cabinet.code} - ${cabinet.name}` : cabinet.code;
      form.appendChild(button);

      return form;
    }

    function renderCabinets() {
      const projectId = projectSelect.value;
      const cabinets = cabinetsByProject[projectId] || [];

      clearCabinets();

      if (!projectId) {
        emptyMessage.textContent = "Выберите проект, чтобы увидеть список шкафов.";
        emptyMessage.style.display = "block";
        return;
      }

      if (cabinets.length === 0) {
        emptyMessage.textContent = "У выбранного проекта пока нет шкафов.";
        emptyMessage.style.display = "block";
        return;
      }

      emptyMessage.style.display = "none";
      cabinets.forEach((cabinet) => cabinetList.appendChild(createDownloadButton(cabinet)));
    }

    projectSelect.addEventListener("change", renderCabinets);
  </script>
</body>
</html>
